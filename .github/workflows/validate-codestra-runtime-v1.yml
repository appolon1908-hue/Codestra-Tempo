name: Validate Codestra Tempo runtime v1

on:
  pull_request:
    paths:
      - "codestra/runtime-v1/**"
      - ".github/workflows/validate-codestra-runtime-v1.yml"
  push:
    branches:
      - development
      - test
      - staging
      - production
      - main
    paths:
      - "codestra/runtime-v1/**"
      - ".github/workflows/validate-codestra-runtime-v1.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate YAML, tenancy, and privacy controls
        shell: python
        run: |
          from pathlib import Path
          import json
          import yaml

          root = Path("codestra/runtime-v1")
          tempo_text = (root / "tempo-codestra.yaml").read_text()
          tempo = yaml.safe_load(tempo_text)
          tenants = json.loads((root / "tenants.json").read_text())
          compose_text = (root / "compose.yaml").read_text()
          compose = yaml.safe_load(compose_text)

          required = {
              "platform", "codestra", "moneybee", "beyvra", "breero",
              "larim-a", "transportation", "booked4seasons", "social",
              "klyrow", "telnexa", "kyqra", "restaurant", "provisioning",
          }
          assert tempo["multitenancy_enabled"] is True
          assert tempo["distributor"]["log_received_spans"]["enabled"] is False
          protocols = tempo["distributor"]["receivers"]["otlp"]["protocols"]
          assert {"grpc", "http"} <= set(protocols)
          assert tempo["storage"]["trace"]["backend"] == "s3"
          assert tempo["compactor"]["compaction"]["block_retention"]
          processors = set(tempo["overrides"]["defaults"]["metrics_generator"]["processors"])
          assert {"service-graphs", "span-metrics", "local-blocks"} <= processors
          assert tempo["usage_report"]["reporting_enabled"] is False
          assert required == set(tenants["allowedTenants"])
          assert tenants["rules"]["customerIdsAreTenantIds"] is False
          assert tenants["rules"]["requestBodiesCaptured"] is False
          assert tenants["rules"]["beyvraTradeCredentialsAllowed"] is False
          assert "ports" not in compose["services"]["tempo"]
          assert compose["services"]["tempo"]["read_only"] is True
          assert "latest" not in compose_text.lower()
          forbidden_literals = ("supersecret", "private_key:", "root_token:", "authorization: bearer")
          assert not any(value in (tempo_text + compose_text).lower() for value in forbidden_literals)
          print("Codestra Tempo runtime validation PASS")
      - name: Validate Compose structure without resolving runtime credentials
        run: docker compose -f codestra/runtime-v1/compose.yaml config --no-interpolate >/dev/null
