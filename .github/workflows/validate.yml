name: Validate Codestra Tempo source authority

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codestra-tempo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    name: validate-source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned parser
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3
      - name: Validate protected source controls
        env:
          PYTHONPYCACHEPREFIX: /tmp/codestra-tempo-pycache
        run: |
          python -m py_compile scripts/validate_repository_security.py tests/test_repository_security.py
          python tests/test_repository_security.py
          python scripts/validate_repository_security.py
      - name: Bind vendored Git tree to exact official commit
        shell: bash
        run: |
          set -Eeuo pipefail
          upstream_ref="$(python -c 'import json; print(json.load(open("CODESTRA_UPSTREAM.json"))["upstream_ref"])')"
          [[ "$upstream_ref" =~ ^[0-9a-f]{40}$ ]]
          staging="$(mktemp -d)"
          trap 'rm -rf -- "$staging"' EXIT
          git init --quiet "$staging/source"
          git -C "$staging/source" remote add origin https://github.com/grafana/tempo.git
          GIT_LFS_SKIP_SMUDGE=1 git -C "$staging/source" fetch --depth 1 --no-tags origin "$upstream_ref"
          git -C "$staging/source" checkout --quiet --detach FETCH_HEAD
          [[ "$(git -C "$staging/source" rev-parse HEAD)" == "$upstream_ref" ]]
          official_tree="$(git -C "$staging/source" rev-parse 'HEAD^{tree}')"
          vendored_tree="$(git rev-parse 'HEAD:upstream')"
          [[ "$vendored_tree" == "$official_tree" ]]
      - name: Reject control-plane secrets and whitespace errors
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -RIlE --exclude-dir=.git --exclude-dir=upstream --exclude-dir=tests \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._~-]{16,}|client_secret[[:space:]]*=[[:space:]]*[^[:space:]<]+)' .
          git diff --check
